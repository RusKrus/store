services:
  postgres:
    image: postgres:16
    container_name: store-db
    restart: always
    environment:
      - POSTGRES_DB=store
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432

  rabbitmq:
    image: rabbitmq:4-management
    container_name: store-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: store_user
      RABBITMQ_DEFAULT_PASS: store_password
