services:
  postgres:
    image: postgres:16
    container_name: store-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=store
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: store-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: store_user
      RABBITMQ_DEFAULT_PASS: store_password

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    restart: unless-stopped
    env_file:
      - .env.rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_EBABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data

volumes:
  rustfs-data:
