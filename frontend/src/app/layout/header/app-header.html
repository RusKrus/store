<header class="mx-auto w-full flex-1 justify-between max-w-360">
  <div class="text-white items-center flex justify-between w-full bg-on-primary-container/95 mat-font-body-sm px-20 pb-3 pt-2 mb-4">
    <span>Technologies for your rhythm</span>
    <span>Help · +1 (213) 555-0149</span>
  </div>

  <div class="flex items-center justify-between mx-20 gap-16 border-primary/30 mb-4">
    <div class="flex items-center gap-8">
      <div class="flex items-center">
        <div class="p-1.25 aspect-square mat-bg-primary-container mat-corner-sm max-w-fit max-h-fit mr-3"><mat-icon>Bolt</mat-icon></div>
        <h1 class="mat-font-headline-lg font-black!">VOLT</h1>
      </div>
      <button matButton="filled" class="h-12!">
        <span class="flex items-center gap-2">
          Catalog
          <mat-icon iconPositionEnd class="size-5! text-[20px]!">view_cozy·</mat-icon>
        </span>
      </button>
    </div>
    
    <mat-form-field 
      appearance="outline" 
      class="app-header__text-field flex-1" 
      subscriptSizing="dynamic"
    >
      <mat-label>Find favorite stuff!</mat-label>
      <input matInput type="text">
    </mat-form-field>

    <div class="flex items-center gap-8">
      <button matButton="outlined" class="h-12!">
        <mat-icon>shopping_cart</mat-icon>
        Cart
      </button>
      <button matButton="filled" class="h-12!">
        <mat-icon>Login</mat-icon>
        Login
      </button>
    </div>
  </div>
  <mat-divider></mat-divider>
</header>
